[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asterodetect"
version = "0.1.0"
description = "Bayesian power-excess detection for solar-like oscillations"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Martin B. Nielsen"}]
dependencies = [
    "AsteroScale @ git+https://github.com/nielsenmb/AsteroScale.git@c348e95dad2769e534176050ddf7b644495b2d59",
    "baldr[numpy] @ git+https://github.com/nielsenmb/Baldr.git@de90e72db0fd0932e12ba92fb67d72c332c2da82",
    "jax>=0.4.28,<0.7",
    "mimir-astro @ git+https://github.com/nielsenmb/Mimir.git@c19b26a023f8f66f583b47ef547e7bd1b32f3a26",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov>=4"]
tutorial = ["jupyter>=1", "matplotlib>=3.7"]
tess-validation = [
    "astroquery>=0.4.7",
    "lightkurve>=2.5",
]

[dependency-groups]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/asterodetect"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
